<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f2" />
    <meta name="description" content="Elementris is coming soon. A playful way to learn the periodic table, one element at a time." />
    <title>Elementris — Coming Soon</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="brand"><span class="brand-mark" aria-hidden="true">e</span>elementris<span class="brand-dot">.</span></header>
      <main>
        <div class="elements" aria-hidden="true">
          <div class="element sodium"><span class="number">11</span><strong>Na</strong><span class="name">Sodium</span></div>
          <div class="element oxygen"><span class="number">8</span><strong>O</strong><span class="name">Oxygen</span></div>
          <div class="element neon"><span class="number">10</span><strong>Ne</strong><span class="name">Neon</span></div>
        </div>
        <p class="status"><span aria-hidden="true"></span> A little chemistry. A lot of play.</p>
        <h1>Coming <span>soon.</span></h1>
        <p class="intro">Learn the periodic table,<br />one element at a time.</p>
        <p class="description">A new puzzle game for curious minds.<br />Your next discovery is just a drop away.</p>
      </main>
      <footer>Small tiles. Big discoveries.</footer>
    </div>
  </body>
</html>
